version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-enterprise
    container_name: crystal-intelligence-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      # Authentication
      - NEO4J_AUTH=neo4j/your-password-here

      # Enterprise license acceptance (for vector index support)
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes

      # Memory configuration
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G

      # Vector index plugin configuration
      - NEO4J_db_index_vector_enabled=true
      - NEO4J_db_index_vector_similarity__function=cosine

      # APOC procedures (optional but recommended)
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*

      # Logging
      - NEO4J_server_logs_debug_level=INFO

      # Network settings
      - NEO4J_server_default__listen__address=0.0.0.0

    volumes:
      # Data persistence
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

    networks:
      - crystal-intelligence

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  crystal-intelligence:
    driver: bridge
