[project]
name = "memory-mcp"
version = "0.1.0"
description = "Local Knowledge Memory MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "pyyaml",
    "pydantic",
    "janome"
]

[project.scripts]
memory-mcp = "memory_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
