[project]
name = "crystal-intelligence-poc"
version = "0.1.0"
description = "Crystal Intelligence knowledge integration PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  "langchain>=0.2",
  "langchain-openai>=0.1.0",
  "langgraph",
  "openai>=1.0.0",
  "neo4j",
  "python-dotenv",
  "tenacity>=8.0.0",
  "apscheduler>=3.10",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "black",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps", "services", "shared"]
include = ["*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["services/mcp-server/src", "shared/lib", "apps/ui-streamlit"]
testpaths = ["services/mcp-server/tests", "tests", "apps/ui-streamlit/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true
